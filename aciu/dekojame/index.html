<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mokėjimas gautas | MafiaInLT</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/png" href="../../images/logo.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alata&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1.25rem;
            font-family: 'Alata', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000000;
            color: #FFFFFF;
            -webkit-font-smoothing: antialiased;
            text-align: center;
        }

        /* Колонкой, иначе логотип и галочка встают в одну строку */
        main {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Конфетти летит позади текста, кликам не мешает */
        #confetti {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .done-logo {
            display: block;
            width: 132px;
            height: 132px;
            margin-bottom: 2rem;
        }

        .done-check {
            display: block;
            width: 34px;
            height: 34px;
            margin-bottom: 1.25rem;
            color: #FFFFFF;
        }

        .done-check circle,
        .done-check path {
            stroke-dasharray: 63;
            stroke-dashoffset: 63;
            animation: doneDraw 0.45s ease forwards;
        }

        .done-check path {
            stroke-dasharray: 16;
            stroke-dashoffset: 16;
            animation: doneDraw 0.3s ease 0.35s forwards;
        }

        @keyframes doneDraw {
            to { stroke-dashoffset: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .done-check circle,
            .done-check path {
                animation: none;
                stroke-dashoffset: 0;
            }
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 400;
            letter-spacing: 0.04em;
            margin-bottom: 0.6rem;
        }

        .done-note {
            font-size: 0.8rem;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.4);
        }

        .done-thanks {
            margin-top: 2rem;
            font-size: 1.35rem;
            letter-spacing: 0.04em;
            color: #FFFFFF;
        }

        /* Логотип — единственная ссылка на странице, ведёт на главную */
        .done-logo-link {
            display: block;
            transition: opacity 0.25s ease;
        }

        .done-logo-link:hover { opacity: 0.75; }
    </style>
</head>
<body>

    <canvas id="confetti" aria-hidden="true"></canvas>

    <main>
        <a href="../../index.html" class="done-logo-link" aria-label="MafiaInLT">
            <img src="../../images/mafia-club-gold.webp" alt="MafiaInLT" class="done-logo" width="132" height="132">
        </a>

        <svg class="done-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <path d="M7.5 12.4l3.1 3.1 6-6.6"/>
        </svg>

        <h1>Mokėjimas gautas</h1>
        <p class="done-note">Kvitas išsiųstas el. paštu</p>

        <p class="done-thanks">Ačiū</p>
    </main>

    <script>
        // Один сдержанный залп конфетти при загрузке: золото и белый на чёрном.
        // Без библиотек — canvas и requestAnimationFrame.
        (function () {
            const canvas = document.getElementById('confetti');
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (!canvas || reduceMotion) return;

            const ctx = canvas.getContext('2d');
            const COLORS = ['#FFFFFF', '#D4AF37'];
            const GRAVITY = 0.14;
            const DRAG = 0.988;

            let width, height, particles = [], frame = null;

            function resize() {
                const dpr = window.devicePixelRatio || 1;
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            // Залп из точки: частицы разлетаются веером вверх и опадают
            function burst(originX, originY, count, spread, power) {
                for (let i = 0; i < count; i++) {
                    const angle = -Math.PI / 2 + (Math.random() - 0.5) * spread;
                    const speed = power * (0.55 + Math.random() * 0.75);

                    particles.push({
                        x: originX,
                        y: originY,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        w: 3 + Math.random() * 4,
                        h: 6 + Math.random() * 8,
                        rot: Math.random() * Math.PI,
                        vrot: (Math.random() - 0.5) * 0.24,
                        color: COLORS[Math.floor(Math.random() * COLORS.length)],
                        life: 0,
                        ttl: 150 + Math.random() * 90
                    });
                }
            }

            function draw() {
                ctx.clearRect(0, 0, width, height);

                particles = particles.filter(function (p) {
                    p.life++;
                    p.vy += GRAVITY;
                    p.vx *= DRAG;
                    p.vy *= DRAG;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.rot += p.vrot;

                    // Гаснут в последней трети жизни, а не пропадают рывком
                    const fadeFrom = p.ttl * 0.65;
                    const alpha = p.life < fadeFrom ? 1 : Math.max(0, 1 - (p.life - fadeFrom) / (p.ttl - fadeFrom));

                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot);
                    ctx.fillStyle = p.color;
                    // Ленточка «схлопывается» при вращении — так плоские полоски выглядят объёмнее
                    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.rot)));
                    ctx.restore();

                    return p.life < p.ttl && p.y < height + 40;
                });

                if (particles.length) {
                    frame = requestAnimationFrame(draw);
                } else {
                    // Частиц не осталось — гасим цикл, чтобы не грелся телефон
                    frame = null;
                    ctx.clearRect(0, 0, width, height);
                }
            }

            function start() {
                const power = width < 480 ? 11 : 14;

                // Два залпа от нижних углов навстречу друг другу
                burst(width * 0.16, height * 0.92, 34, 0.9, power);
                burst(width * 0.84, height * 0.92, 34, 0.9, power);

                // Третий, послабее, из центра — чтобы верх экрана не пустовал
                setTimeout(function () {
                    burst(width * 0.5, height * 0.78, 26, 1.5, power * 0.85);
                    if (!frame) frame = requestAnimationFrame(draw);
                }, 220);

                if (!frame) frame = requestAnimationFrame(draw);
            }

            resize();
            window.addEventListener('resize', resize);
            start();
        })();
    </script>

</body>
</html>
