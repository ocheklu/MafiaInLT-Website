<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRL game session | MafiaInLT</title>
    <meta name="description" content="Registration for the IRL game session.">
    <!-- Puslapis skirtas QR kodui renginyje - paieskoje jo nereikia,
         sitemap.xml jo taip pat nera ir is navigacijos i ji nesivedama -->
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/png" href="../images/logo.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alata&family=Bebas+Neue&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1.25rem;
            font-family: 'Alata', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000000;
            color: #FFFFFF;
            -webkit-font-smoothing: antialiased;
        }

        /* Confetti draws above everything, clicks pass through */
        #confetti {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .reg-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        /* Two logos side by side, split by a hairline divider */
        .reg-logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.4rem;
            margin-bottom: 2.25rem;
        }

        .reg-logo-mafia {
            display: block;
            width: 118px;
            height: 118px;
        }

        /* based.png has its own black background - on a black page only the star shows */
        .reg-logo-based {
            display: block;
            width: 114px;
            height: 114px;
        }

        .reg-logos-divider {
            width: 1px;
            height: 66px;
            background: rgba(255, 255, 255, 0.18);
        }

        .reg-title {
            font-family: 'Bebas Neue', 'Alata', sans-serif;
            font-size: 2.6rem;
            font-weight: 400;
            letter-spacing: 0.06em;
            line-height: 1.05;
            margin-bottom: 2.1rem;
        }

        .reg-form {
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
        }

        .reg-input {
            width: 100%;
            min-height: 50px;
            padding: 0 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: transparent;
            color: #FFFFFF;
            font-family: inherit;
            font-size: 1rem;
            border-radius: 0;
            -webkit-appearance: none;
            transition: border-color 0.25s ease;
        }

        .reg-input::placeholder { color: rgba(255, 255, 255, 0.35); }

        .reg-input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.55);
        }

        /* Chrome autofill paints the field white - keep it black */
        .reg-input:-webkit-autofill,
        .reg-input:-webkit-autofill:focus {
            -webkit-text-fill-color: #FFFFFF;
            -webkit-box-shadow: 0 0 0 1000px #000000 inset;
            transition: background-color 9999s ease-in-out 0s;
        }

        .reg-input:user-invalid { border-color: rgba(255, 90, 90, 0.6); }

        /* Bot trap - invisible to people, never filled by them */
        .reg-trap {
            position: absolute;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
        }

        .reg-submit {
            min-height: 54px;
            margin-top: 0.6rem;
            border: 1px solid #FFFFFF;
            background: #FFFFFF;
            color: #000000;
            font-family: inherit;
            font-size: 1rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease, opacity 0.25s ease;
        }

        @media (hover: hover) {
            .reg-submit:hover:not(:disabled) {
                background: transparent;
                color: #FFFFFF;
            }
        }

        .reg-submit:disabled { cursor: default; }

        /* Sending - button dimmed */
        .reg-submit.is-sending { opacity: 0.45; }

        /* Success - gold, label turns into You're in! */
        .reg-submit.is-done {
            background: #c9a84c;
            border-color: #c9a84c;
            color: #000000;
            opacity: 1;
        }

        .reg-error {
            display: none;
            margin-top: 1rem;
            font-size: 0.78rem;
            line-height: 1.5;
            color: rgba(255, 120, 120, 0.85);
        }

        @media (max-width: 360px) {
            .reg-logo-mafia { width: 98px; height: 98px; }
            .reg-logo-based { width: 94px; height: 94px; }
            .reg-title { font-size: 2.1rem; }
        }
    </style>
</head>
<body>

    <canvas id="confetti"></canvas>

    <main class="reg-card">
        <div class="reg-logos">
            <img src="../images/mafia-club-gold.webp" alt="MafiaInLT" class="reg-logo-mafia" width="118" height="118">
            <span class="reg-logos-divider" aria-hidden="true"></span>
            <img src="../images/based.png" alt="Based" class="reg-logo-based" width="114" height="114">
        </div>

        <h1 class="reg-title">IRL game session</h1>

        <form class="reg-form" id="regForm" action="https://formspree.io/f/mdenyely" method="POST" novalidate>
            <input type="text" class="reg-input" name="name" placeholder="Name" autocomplete="name" required>
            <input type="email" class="reg-input" name="email" placeholder="Email" autocomplete="email" inputmode="email" required>

            <!-- Formspree service fields: mail subject and event tag -->
            <input type="hidden" name="_subject" value="IRL game session - registration">
            <input type="hidden" name="event" value="IRL game session">

            <!-- Honeypot: filled in = bot -->
            <input type="text" class="reg-trap" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">

            <button type="submit" class="reg-submit" id="regSubmit">Join</button>
        </form>

        <p class="reg-error" id="regError"></p>
    </main>

    <script>
        (function () {
            const form    = document.getElementById('regForm');
            const button  = document.getElementById('regSubmit');
            const errorEl = document.getElementById('regError');

            let done = false;

            form.addEventListener('submit', async function (event) {
                event.preventDefault();

                if (done || button.classList.contains('is-sending')) return;

                // Own validity check instead of the browser one, to keep the styling
                if (!form.checkValidity()) {
                    form.reportValidity();
                    return;
                }

                errorEl.style.display = 'none';
                button.classList.add('is-sending');
                button.disabled = true;
                button.textContent = 'Sending...';

                try {
                    const response = await fetch(form.action, {
                        method: 'POST',
                        body: new FormData(form),
                        headers: { 'Accept': 'application/json' }
                    });

                    if (!response.ok) throw new Error('Formspree responded ' + response.status);

                    done = true;
                    button.classList.remove('is-sending');
                    button.classList.add('is-done');
                    button.textContent = "You're in!";
                    form.querySelectorAll('.reg-input').forEach(function (input) {
                        input.disabled = true;
                    });

                    fireConfetti();
                } catch (err) {
                    button.classList.remove('is-sending');
                    button.disabled = false;
                    button.textContent = 'Join';
                    errorEl.textContent = "Couldn't send it. Check your connection and try again.";
                    errorEl.style.display = 'block';
                }
            });

            // --- Confetti: no libraries, bursts out of the button, ~2 seconds ---
            function fireConfetti() {
                const canvas = document.getElementById('confetti');
                const ctx    = canvas.getContext('2d');
                const dpr    = window.devicePixelRatio || 1;

                canvas.width  = window.innerWidth  * dpr;
                canvas.height = window.innerHeight * dpr;
                ctx.scale(dpr, dpr);

                const rect    = button.getBoundingClientRect();
                const originX = rect.left + rect.width / 2;
                const originY = rect.top  + rect.height / 2;

                const colors = ['#c9a84c', '#e6c878', '#FFFFFF', '#8f7a37'];
                const pieces = [];

                for (let i = 0; i < 120; i++) {
                    // Upward half-circle spread, speeds mixed
                    const angle = (-Math.PI / 2) + (Math.random() - 0.5) * Math.PI * 1.15;
                    const speed = 9 + Math.random() * 15;

                    pieces.push({
                        x: originX,
                        y: originY,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        w: 5 + Math.random() * 5,
                        h: 8 + Math.random() * 6,
                        rotation: Math.random() * Math.PI * 2,
                        spin: (Math.random() - 0.5) * 0.3,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        life: 1
                    });
                }

                let frame = 0;

                (function tick() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    frame++;

                    let alive = false;

                    pieces.forEach(function (p) {
                        if (p.life <= 0) return;

                        p.vy += 0.28;            // gravity
                        p.vx *= 0.99;            // drag
                        p.x  += p.vx;
                        p.y  += p.vy;
                        p.rotation += p.spin;

                        if (frame > 45) p.life -= 0.022;   // fades out at the end
                        if (p.y > window.innerHeight + 40) p.life = 0;
                        if (p.life <= 0) return;

                        alive = true;

                        ctx.save();
                        ctx.globalAlpha = Math.max(p.life, 0);
                        ctx.translate(p.x, p.y);
                        ctx.rotate(p.rotation);
                        ctx.fillStyle = p.color;
                        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                        ctx.restore();
                    });

                    if (alive) {
                        requestAnimationFrame(tick);
                    } else {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                    }
                })();
            }
        })();
    </script>

</body>
</html>
